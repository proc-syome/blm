<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="../favicon.png" />
    <title>SpellSim — 黒魔道士スキル回しシミュレーター</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // 前に選んだライト / ダークを、描く前に当てる（ちらつき防止）
      try {
        const t = localStorage.getItem("blm:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>SpellSim <small>patch 7.5x</small></h1>
        <p class="sub">黒魔道士の回しを、1手ずつ組み立てて確かめられます。</p>
      </div>
    </header>
    <main id="app"></main>
    <footer class="foot">
      <p>自分用に作った、非公式のファンサイトです。</p>
      <p>© SQUARE ENIX</p>
    </footer>
    <script type="module" src="./ui/main.js"></script>
  </body>
</html>
